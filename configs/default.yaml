# configs/default.yaml
defaults:
  - dataset: mini_imagenet
  - _self_

# Global Execution Settings
mode: "train"                   # Options: 'pretrain', 'train', 'eval'
seed: 42
device: "cuda"
checkpoint_path: null           # Stage 1 checkpoint (for 'train') or Stage 2 checkpoint (for 'eval')

# Few-Shot Task Settings (Standard 5-Way 1-Shot Benchmark)
task:
  n_way: 5
  n_shot: 1
  n_query: 15
  train_episodes: 2000
  val_episodes: 200
  test_episodes: 10000

# Model Architecture Configuration (Gold Baseline: 4L Uncoarsened GINE + Mean + Set Recon)
model:
  modality: "graph"             # Options: 'graph', 'vision', 'multimodal'
  fsl_method: "gmn"             # Options: 'protonet' (Stage 1), 'gmn' (Stage 2)
  vision_checkpoint: null       # Path to pretrained RFS ResNet-12 checkpoint (for hypercolumns)
  freeze_vision: true           # Keep pretrained RFS backbone frozen
  num_layers: 4
  graph_hidden_dim: 128
  graph_proj_dim: 640
  node_feat_dim: 11
  edge_feat_dim: 14
  dropout: 0.1
  norm_type: "graph"            # Options: 'graph', 'layer', 'batch'
  pooling_method: "mean"        # Options: 'mean', 'global_attention'
  train_eps: true
  use_input_mlp: true
  use_jk: true
  use_reconstruction_dist: true # true = Unpooled Set Reconstruction, false = Global Pooled cdist
  distance_metric: "cosine"     # Used when fsl_method == 'protonet'
  pretrain_scale: 10.0          # Cosine logit multiplier (scale * cos)
  scale: 5.0                    # Logit multiplier (-scale * dist for GMN; scale * cos for ProtoNet)
  learnable_scale: false
  hc_layers: [1, 2, 3]          # ResNet-12 stages to concat: e.g. [1, 2, 3], [1, 2, 3, 4], [2, 3], or int 3
  hc_radius_mode: "disk_5pt"    # "none" | "concat_r" | "disk_5pt" | "disk_9pt" | "center_ring_concat"
  hc_disk_scale: 0.7            # Multiplier on node radius r for disk ring offsets (0.7 * r)
  hc_stage_l2norm: true         # L2-normalize each stage slice before concatenating across stages

# Training Hyperparameters
training:
  epochs: 60
  batch_size: 128               # Used in Stage 1 'pretrain'
  lr: 0.001                     # Stage 1 pre-training learning rate
  backbone_lr: 0.0001           # Stage 2 GMN GINE backbone learning rate (1e-4)
  matching_lr: 0.001            # Stage 2 GMN matching head learning rate (1e-3)
  weight_decay: 0.0001          # AdamW weight decay
  label_smoothing: 0.0          # Used in Stage 1 'pretrain'
  use_hard_mining: false        # Enable Batch-Hard Triplet Margin in GMNEpisodicLoss
  triplet_margin: 0.2
  lambda_triplet: 0.2
  save_dir: "experiments"
  num_workers: 4

# Route Hydra outputs directly into training.save_dir
hydra:
  run:
    dir: ${training.save_dir}
