defaults:
  - dataset: mini_imagenet

mode: "train"               # 'train' or 'eval'
seed: 42
checkpoint_path: "none"     # Update this when running eval

training:
  epochs: 100
  lr: 0.1
  weight_decay: 0.0005
  save_dir: "experiments"

task:
  n_way: 5
  n_shot: 1
  n_query: 15
  train_episodes: 100
  val_episodes: 500
  test_episodes: 2000

model:
  modality: "graph"             # 'vision', 'graph', or 'multimodal'
  hidden_dim: 128
  node_feat_dim: 11             # Synchronized with multimodal_network.py
  edge_feat_dim: 14             # Synchronized with multimodal_network.py
  num_layers: 3                 # Required by GraphEncoder
  dropout: 0.1                  # Required by GraphEncoder
  gnn_type: "GINE"              # 'GINE', 'GATv2', 'ResGated', 'GPS'
  fusion_type: "concat"         # 'concat', 'add', 'gate'
  fsl_method: "protonet"        # 'protonet' or 'matching'
  distance_metric: "euclidean"  # 'euclidean' or 'cosine'
  use_simpleshot: false         # Set true to enable CL2N
