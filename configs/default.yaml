# configs/default.yaml
defaults:
  - dataset: mini_imagenet
  - _self_

# Global Execution Settings
mode: "train"
seed: 42
device: "cuda"
checkpoint_path: null           # Added at root to support main.py eval routing

# Few-Shot Task Settings
task:
  n_way: 15
  n_shot: 1
  n_query: 15
  train_episodes: 200
  val_episodes: 200
  test_episodes: 2000

# Model Architecture Configuration
model:
  modality: "multimodal"        # Options: 'vision', 'graph', 'multimodal'
  vision_checkpoint: null       # Path to trained vision checkpoint
  graph_checkpoint: null        # Path to trained graph checkpoint
  freeze_vision: false          # Set true to freeze visual stream
  freeze_graph: false           # Set true to freeze graph stream
  graph_hidden_dim: 128
  graph_proj_dim: 640
  node_feat_dim: 11
  edge_feat_dim: 14
  num_layers: 3
  dropout: 0.1
  gnn_type: "GINE"              # Options: 'GINE', 'GATv2', 'ResGated', 'GPS'
  norm_type: "graph"            # Options: 'graph', 'layer', 'batch' (Cai et al., ICML 2021)
  pooling_method: "global_attention"        # Options: 'mean', 'dual_pool', 'global_attention', 'softmax', 'gmt', 'sag_pool'
  train_eps: true               # Options: Trainable epsilon in GINE
  use_input_mlp: true           # Options: 2-layer non-linear input MLP
  use_jk: true                  # Options: Jumping Knowledge (JK-Net)
  fusion_type: "asymmetric"     # Options: 'asymmetric', 'gated', 'concat', 'add', 'bottleneck'
  modality_dropout_v: 0.15      # Probability of zeroing vision during joint pretrain
  modality_dropout_g: 0.15      # Probability of zeroing graph during joint pretrain
  modality_dropout: 0.0         # Options: 0.0 (off) or 0.15 (on)
  fsl_method: "protonet"        # Options: 'protonet', 'matching'
  distance_metric: "cosine"     # Options: 'cosine', 'euclidean'
  scale: 10.0                   # Options: tau parameter 
  learnable_scale: false        # Options: Learnable inverse temperature (1/tau)

# Training Hyperparameters
training:
  epochs: 100
  batch_size: 256
  optimizer: "disentangled"     # Options: 'disentangled' (Recommended), 'adamw', 'sgd'
  vision_lr: 0.05               # Optimal for ResNet-12 SGD
  vision_weight_decay: 0.0005   # Standard vision weight decay
  graph_lr: 0.001               # Optimal for GINE AdamW
  graph_weight_decay: 0.0001    # Standard GNN weight decay
  fusion_lr: 0.001              # Fast coordinate alignment
  fusion_weight_decay: 0.0001
  lr: 0.001                     # Automatically upgraded to 0.1 for SGD in train.py
  weight_decay: 0.0005
  loss_type: "ce_multitask"     # Options: 'ce_multitask', 'clip_ce', 'supcon_ce', 'cosine_ce'
  lambda_aux: 0.5               # Weight for unimodal auxiliary CE heads
  lambda_contrast: 0.1          # Weight for cross-modal contrastive/align loss
  use_ogm: false                # On-the-fly gradient modulation (OGM-GE)
  ogm_alpha: 1.0                # Hyperparameter controlling OGM dampening steepness
  label_smoothing: 0.0          # Options: 0.0 (off), 0.10, 0.15 (for pre-training)
  save_dir: "experiments"
  num_workers: 4

# Evaluation Settings
evaluation:
  checkpoint_path: null

# =============================================================================
# Option A: Route Hydra outputs directly into training.save_dir
# Prevents creating duplicate 'outputs/' directories on disk
# =============================================================================
hydra:
  run:
    dir: ${training.save_dir}