# configs/default.yaml
defaults:
  - dataset: mini_imagenet
  - _self_

# Global Execution Settings
mode: "train"                   # Options: 'pretrain', 'train', 'eval'
seed: 42
device: "cuda"
checkpoint_path: null           # Stage 1 checkpoint (for 'train') or Stage 2 checkpoint (for 'eval')

# Few-Shot Task Settings (Standard 5-Way 1-Shot Benchmark)
task:
  n_way: 5
  n_shot: 1
  n_query: 15
  train_episodes: 500
  val_episodes: 600
  test_episodes: 10000

# Model Architecture Configuration (Champion: 4L Coarse GINE h128 + Set Recon)
model:
  modality: "multimodal"        # Options: 'graph', 'vision', 'multimodal'
  fsl_method: "gmn"             # Options: 'protonet' (Stage 1), 'gmn' (Stage 2)
  vision_checkpoint: "checkpoints/pretrained_resnet12/resnet12_deepemd_pretrain.pth"
  num_layers: 4
  graph_hidden_dim: 128
  graph_proj_dim: 640
  node_feat_dim: 11
  edge_feat_dim: 14
  gnn_dropout: 0.1              # Feature dropout inside intermediate GINE layers & app_input_mlp
  norm_type: "graph"            # Options: 'graph', 'layer', 'batch'
  pooling_method: "mean"        # Options: 'mean', 'global_attention'
  train_eps: true
  use_input_mlp: true
  use_jk: true
  use_reconstruction_dist: true # true = Unpooled Set Reconstruction, false = Global Pooled cdist
  distance_metric: "cosine"     # Used when fsl_method == 'protonet'
  pretrain_cosine_scale: 10.0   # Stage 1 64-class cosine logit multiplier (scale * cos)
  gmn_dist_scale: 5.0           # Stage 2 GMN distance logit multiplier (-scale * dist)

  # --- Visual Hypercolumn Extraction Settings ---
  hc_layers: [2, 3, 4]          # ResNet stages to concat (1,120-D)
  hc_unfreeze_layers: [4]       # ResNet stages to fine-tune in Stage 2: [] (frozen), [4], [3, 4]
  hc_radius_mode: "disk_5pt"    # "none" | "concat_r" | "disk_5pt" | "disk_9pt" | "center_ring_concat"

  # --- Multimodal Appearance Fusion Toggles ---
  app_mlp_dim: 256              # Intermediate hidden dim of app_input_mlp (128, 256, 384)
  app_graph_dropout: 0.35       # Whole-graph modality dropout on x_app during training
  use_app_node_input: true      # Option 1: Gated appearance residual on initial node features
  use_app_edges: true           # Option 2: Gated edge appearance contrast |a_u - a_v| on edges
  use_app_recon_fusion: true    # Option 5: 75/25 appearance + GNN fusion in dist_recon
  use_full_app_prop: false      # Propagate full 1,120-D x_app across GNN hops
  use_center_norm: false        # Per-channel mean centering in dist_recon

# Training Hyperparameters
training:
  epochs: 10                    # Stage 2 default (pass training.epochs=60 for Stage 1 'pretrain')
  batch_size: 128               # Used in Stage 1 'pretrain'
  lr: 0.001                     # Stage 1 pre-training learning rate
  backbone_lr: 0.00002          # Stage 2 GMN GINE backbone learning rate (2e-5)
  matching_lr: 0.0005           # Stage 2 GMN matching head learning rate (5e-4)
  vision_lr: 0.00001            # Stage 2 unfrozen ResNet-12 stages learning rate (1e-5)
  co_train_alpha: 0.5           # Weight for auxiliary GNN-branch co-training loss
  weight_decay: 0.001           # AdamW weight decay
  save_dir: "experiments"
  num_workers: 4

# Route Hydra outputs directly into training.save_dir
hydra:
  run:
    dir: ${training.save_dir}
